<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#3a2a1a"/>
      <stop offset="1" stop-color="#140d07"/>
    </radialGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b07a45"/>
      <stop offset="1" stop-color="#6b4320"/>
    </linearGradient>
    <radialGradient id="coin" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.5" stop-color="#f2c230"/>
      <stop offset="1" stop-color="#a87412"/>
    </radialGradient>
  </defs>
  <!-- frame -->
  <rect x="8" y="8" width="496" height="496" rx="72" fill="url(#bg)" stroke="#c9a24a" stroke-width="12"/>
  <!-- pouch -->
  <path d="M150 210 C 110 270, 110 400, 200 420 L 300 420 C 360 400, 360 280, 310 210 Z" fill="url(#bag)" stroke="#3b230f" stroke-width="10" stroke-linejoin="round"/>
  <path d="M160 170 L 300 170 L 280 215 L 180 215 Z" fill="#8a5a2c" stroke="#3b230f" stroke-width="10" stroke-linejoin="round"/>
  <path d="M175 215 C 205 228, 255 228, 285 215" fill="none" stroke="#e0b25a" stroke-width="12" stroke-linecap="round"/>
  <!-- coins -->
  <ellipse cx="335" cy="400" rx="78" ry="26" fill="#a87412"/>
  <ellipse cx="335" cy="385" rx="78" ry="26" fill="url(#coin)" stroke="#7a520c" stroke-width="5"/>
  <ellipse cx="335" cy="360" rx="78" ry="26" fill="#a87412"/>
  <ellipse cx="335" cy="345" rx="78" ry="26" fill="url(#coin)" stroke="#7a520c" stroke-width="5"/>
  <circle cx="360" cy="270" r="62" fill="url(#coin)" stroke="#7a520c" stroke-width="7"/>
  <circle cx="360" cy="270" r="40" fill="none" stroke="#c48f1a" stroke-width="6"/>
  <!-- arrow: off to sell -->
  <path d="M120 130 C 200 70, 300 70, 370 120" fill="none" stroke="#7ee07e" stroke-width="18" stroke-linecap="round"/>
  <path d="M385 80 L 400 140 L 340 145 Z" fill="#7ee07e"/>
